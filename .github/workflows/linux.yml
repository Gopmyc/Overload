name: Linux

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
      - Adventurer

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: ./

jobs:
  build:
    name: Clang ${{ matrix.configuration }} x64
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    strategy:
      matrix:
        configuration: [Debug, Release, Publish]

    steps:
    - uses: actions/checkout@v6

    - name: Install Dependencies
      run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev xvfb libgl1-mesa-dri

    - name: Generate premake5 solution
      working-directory: ${{env.SOLUTION_FILE_PATH}}
      run: ./gen_proj.sh

    - name: Build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: |
        CONFIG_LOWER=$(echo "${{ matrix.configuration }}" | tr '[:upper:]' '[:lower:]')
        make -j$(nproc) config=${CONFIG_LOWER}_x64

    - name: Run the engine tests
      run: Bin/${{ matrix.configuration }}/OvTests/OvTests

    # The game draws with Mesa's software renderer under a virtual display
    - name: Run the in-game checks
      run: xvfb-run -a -s "-screen 0 1280x720x24" Tests/run_game_checks.sh Bin/${{ matrix.configuration }}/OvGame/OvGame
